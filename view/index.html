<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Trace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-mode="panel">
    <div id="app">
      <header class="topbar">
        <select id="ws" aria-label="Workspace"></select>
        <span id="branch" class="branch"></span>
        <span id="live" class="badge live" hidden>LIVE</span>
        <span class="spacer"></span>
        <select id="range" aria-label="Time range"></select>
      </header>
      <div id="notices"></div>
      <section id="graph" class="graph" aria-label="Agents"></section>
      <section class="bottom">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-trace" aria-selected="true">Trace</button>
          <button class="tab" role="tab" id="tab-tokens" aria-selected="false">Tokens &amp; cost</button>
          <button class="tab" role="tab" id="tab-events" aria-selected="false">Events<span id="attn" class="count" title="Agents that need you or failed"></span></button>
          <span id="zoom" class="zoom"><button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button><button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button></span>
          <span class="spacer"></span>
          <div id="totals" class="totals"></div>
        </div>
        <div id="panel-trace" class="tabpanel" role="tabpanel"></div>
        <div id="panel-tokens" class="tabpanel" role="tabpanel" hidden></div>
        <div id="panel-events" class="tabpanel" role="tabpanel" hidden></div>
      </section>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
