<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Trace preview</title>
    <link rel="stylesheet" href="../view/styles.css" />
  </head>
  <body data-mode="panel">
    <div id="app">
      <header class="topbar">
        <select id="project" aria-label="Project" hidden></select>
        <select id="ws" aria-label="Workspace"></select>
        <span id="branch" class="branch"></span>
        <span id="live" class="badge live" hidden>LIVE</span>
        <span class="seg" role="group" aria-label="View">
          <button id="view-tree" class="segb" aria-pressed="true" title="Agents as a tree">Tree</button>
          <button id="view-seq" class="segb" aria-pressed="false" title="Messages between agents, in order">Sequence</button>
        </span>
        <select id="seq-ws" aria-label="Workspace shown in the sequence" hidden></select>
        <label id="seq-tools-wrap" class="check" hidden><input type="checkbox" id="seq-tools" /> Tool calls</label>
        <button id="seq-focus" class="chip-x" title="Show every agent again" hidden></button>
        <span class="spacer"></span>
        <select id="range" aria-label="Time range"></select>
      </header>
      <div id="notices"></div>
      <section id="graph" class="graph" aria-label="Agents"></section>
      <section class="bottom">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-trace" aria-selected="true">Trace</button>
          <button class="tab" role="tab" id="tab-tokens" aria-selected="false">Tokens &amp; cost</button>
          <button class="tab" role="tab" id="tab-events" aria-selected="false">Events<span id="attn" class="count" title="Agents that need you or failed"></span></button>
          <button class="tab" role="tab" id="tab-delivery" aria-selected="false" title="Pull requests, contributors and DORA metrics from GitHub">Delivery</button>
          <span id="zoom" class="zoom"><button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button><button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button></span>
          <span class="spacer"></span>
          <div id="totals" class="totals"></div>
        </div>
        <div id="panel-trace" class="tabpanel" role="tabpanel"></div>
        <div id="panel-tokens" class="tabpanel" role="tabpanel" hidden></div>
        <div id="panel-events" class="tabpanel" role="tabpanel" hidden></div>
        <div id="panel-delivery" class="tabpanel" role="tabpanel" hidden></div>
      </section>
    </div>
    <script type="module">
      // Plain-browser preview: ?theme=dark switches the theme. Serve the plugin folder over http
      // (for example `python3 -m http.server` in it) and open /dev/preview.html.
      import { installMock } from './mock-orca.js';
      if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.classList.add('dark');
      installMock();
      await import('../view/app.js');
    </script>
  </body>
</html>
